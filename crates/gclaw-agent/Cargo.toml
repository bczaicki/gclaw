[package]
name = "gclaw-agent"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1"

[dependencies]
gclaw-core = { path = "../gclaw-core" }
tokio = { version = "1", features = ["sync", "rt", "fs", "process", "time"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
tracing = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dirs = "6"
regex = "1"
glob = "0.3"
walkdir = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tempfile = "3"
