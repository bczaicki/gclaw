[package]
name = "gclaw-providers"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1"

[dependencies]
gclaw-core = { path = "../gclaw-core" }
ollama-rs = { version = "0.2", features = ["stream"] }
tokio = { version = "1", features = ["sync"] }
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
