[package]
name = "gclaw-mcp"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1"

[dependencies]
gclaw-core = { path = "../gclaw-core" }
tokio = { version = "1", features = ["sync", "rt", "process", "time", "io-util"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync"] }
