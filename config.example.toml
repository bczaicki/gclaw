[provider]
active = "ollama"  # "ollama", "openai", or "anthropic"

[provider.ollama]
url = "http://localhost:11434"
default_model = "qwen3.5:9b"

[provider.openai]
base_url = "https://api.openai.com/v1"  # or any OpenAI-compatible endpoint
api_key = ""  # or set GCLAW_OPENAI_API_KEY env var
default_model = "gpt-4o-mini"

[provider.anthropic]
base_url = "https://api.anthropic.com"
api_key = ""  # or set ANTHROPIC_API_KEY env var
default_model = "claude-sonnet-4-6"
max_tokens = 8192

[agent]
max_iterations = 10
system_prompt = "You are a helpful assistant."
# workspace_dir = "./workspace"  # Path to SOUL.md, IDENTITY.md, etc. (default: ./workspace)

[channels.telegram]
enabled = false
token = ""  # or set GCLAW_TELEGRAM_TOKEN env var

[channels.discord]
enabled = false
token = ""  # or set GCLAW_DISCORD_TOKEN env var

[channels.slack]
enabled = false
bot_token = ""   # xoxb-... or set GCLAW_SLACK_BOT_TOKEN
app_token = ""   # xapp-... or set GCLAW_SLACK_APP_TOKEN

[channels.whatsapp]
enabled = false
access_token = ""       # or set GCLAW_WHATSAPP_ACCESS_TOKEN
phone_number_id = ""
verify_token = ""
webhook_port = 8080

[container]
enabled = false
runtime = "docker"  # or "podman"
image = "gclaw-sandbox:latest"
# Build the sandbox image: docker build -t gclaw-sandbox:latest -f Dockerfile.sandbox .

# -----------------------------------------------------------------------------
# MCP servers (Model Context Protocol)
#
# Each server is launched on stdio and its tools are registered with the agent
# as mcp__{server}__{tool}. Tools become callable by the model alongside the
# built-in file/shell tools. Failed servers are logged and skipped — they
# never crash gclaw.
#
# [mcp_servers.filesystem]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
#
# [mcp_servers.github]
# command = "gh"
# args = ["mcp"]
# env = { GITHUB_TOKEN = "${env:GITHUB_TOKEN}" }
#
# [mcp_servers.sqlite]
# command = "uvx"
# args = ["mcp-server-sqlite", "--db-path", "/tmp/test.db"]
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Skills (prompt templates invoked as /name args)
#
# Skills are not configured here — they're discovered from these directories
# (later locations override earlier ones):
#   1. ~/.gclaw/skills/<name>/SKILL.md      (user-level)
#   2. ./.gclaw/skills/<name>/SKILL.md      (project-level)
#   3. <workspace_dir>/skills/<name>/SKILL.md (workspace-level)
#
# Each SKILL.md has YAML frontmatter (description, argument-hint, etc.) plus
# a markdown body that's injected as extra system context when invoked. The
# body can use $ARGUMENTS, $1, $2, ... for argument substitution.
# -----------------------------------------------------------------------------
