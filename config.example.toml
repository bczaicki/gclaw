[provider]
active = "ollama"  # "ollama", "openai", or "anthropic"

[provider.ollama]
url = "http://localhost:11434"
default_model = "qwen3.5:4b"

[provider.openai]
base_url = "https://api.openai.com/v1"  # or any OpenAI-compatible endpoint
api_key = ""  # or set GCLAW_OPENAI_API_KEY env var
default_model = "gpt-4o-mini"

[provider.anthropic]
base_url = "https://api.anthropic.com"
api_key = ""  # or set ANTHROPIC_API_KEY env var
default_model = "claude-sonnet-4-6"
max_tokens = 8192

[agent]
max_iterations = 10
system_prompt = "You are a helpful assistant."
# workspace_dir = "./workspace"  # Path to SOUL.md, IDENTITY.md, etc. (default: ./workspace)

[channels.telegram]
enabled = false
token = ""  # or set GCLAW_TELEGRAM_TOKEN env var

[channels.discord]
enabled = false
token = ""  # or set GCLAW_DISCORD_TOKEN env var

[channels.slack]
enabled = false
bot_token = ""   # xoxb-... or set GCLAW_SLACK_BOT_TOKEN
app_token = ""   # xapp-... or set GCLAW_SLACK_APP_TOKEN

[channels.whatsapp]
enabled = false
access_token = ""       # or set GCLAW_WHATSAPP_ACCESS_TOKEN
phone_number_id = ""
verify_token = ""
webhook_port = 8080

[container]
enabled = false
runtime = "docker"  # or "podman"
image = "gclaw-sandbox:latest"
# Build the sandbox image: docker build -t gclaw-sandbox:latest -f Dockerfile.sandbox .
