name: Bug Report
description: Report a bug in gclaw
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you running?
      placeholder: "e.g. macOS 15.2, Ubuntu 24.04, Arch Linux"
    validations:
      required: true

  - type: input
    id: rust-version
    attributes:
      label: Rust Version
      description: Output of `rustc --version`
      placeholder: "e.g. rustc 1.82.0 (f6e511eec 2024-10-15)"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: LLM Provider
      description: Which provider were you using?
      options:
        - Ollama
        - Anthropic
        - OpenAI
        - Other OpenAI-compatible
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: Channel
      description: Which channel were you using?
      options:
        - TUI
        - Telegram
        - Discord
        - Slack
        - WhatsApp
        - Headless (no TUI)
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Set config to ...
        2. Run `cargo run --release`
        3. Send message "..."
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages or logs if available.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant Config
      description: Paste relevant sections of your `config.toml` (redact API keys!).
      render: toml

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or log output.
