name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Describe the problem you're trying to solve, not just the solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What's frustrating or missing today?
      placeholder: "I'm always frustrated when ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any other approaches or workarounds?

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of gclaw does this relate to?
      options:
        - Core / Config
        - Agent Loop
        - Providers (Ollama, OpenAI, Anthropic)
        - Channels (Telegram, Discord, Slack, WhatsApp)
        - TUI
        - Tools
        - Container Sandbox
        - MCP
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, mockups, or references.
